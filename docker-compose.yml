services:
  # ============================================================================
  # 1. MySQL Database Service
  # ============================================================================
  database:
    image: mysql:8.0
    container_name: dravix-database
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supply_chain_db}
      MYSQL_USER: ${MYSQL_USER:-dravix_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dravix_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dravix_root_password_2026}
    # Database is kept internal to dravix-network for security.
    # Uncomment ports below only if external direct DB access (e.g., DBeaver/Workbench) is required:
    # ports:
    #   - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./local_dump_clean.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dravix_root_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dravix-network

  # ============================================================================
  # 2. Spring Boot Backend Service
  # ============================================================================
  backend:
    build:
      context: ./supply-chain-backend
      dockerfile: Dockerfile
    image: dravix-scm-backend:latest
    container_name: dravix-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-supply_chain_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-dravix_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-dravix_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-d2d5OTlhMzJmY2I3YTI1NzRlY2U4NWJiYWMyZDU2YjFhMmU4NWI5YmFjMmQ1NmIxYTJlODViOWI=}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_RETENTION_DAYS: ${AWS_S3_RETENTION_DAYS:-30}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-d2d5OTlhMzJmY2I3YTI1NzRlY2U4NWJiYWMyZDU2YjE=}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCMS_CORS_ALLOWED_ORIGINS: ${SCMS_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://localhost:3000}
      TESSDATA_PATH: /app/tessdata
    volumes:
      - backend_uploads:/app/uploads
      - ./tessdata:/app/tessdata:ro
    # Backend port is accessible through Nginx reverse proxy on port 80.
    # Uncomment ports below only if direct external access to 8082 is needed:
    # ports:
    #   - "${BACKEND_PORT:-8082}:8082"
    networks:
      - dravix-network

  # ============================================================================
  # 3. React Vite Frontend Service (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./supply-chain-system
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    image: dravix-scm-frontend:latest
    container_name: dravix-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./supply-chain-system/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dravix-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

# ==============================================================================
# Shared Bridge Network
# ==============================================================================
networks:
  dravix-network:
    driver: bridge
