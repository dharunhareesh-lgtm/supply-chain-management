spring.application.name=supply-chain-backend

# Server Configuration
server.port=${PORT:8082}
server.shutdown=graceful

# Database Configuration (supports both local, custom env, and Railway MySQL vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:supply_chain_db}?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

# Hikari Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email SMTP settings (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:${EMAIL_USERNAME:dharunhareesh@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${EMAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Health Check Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.scms=INFO
logging.level.org.springframework.web=INFO

# Security configurations
jwt.secret=${JWT_SECRET:d2d5OTlhMzJmY2I3YTI1NzRlY2U4NWJiYWMyZDU2YjFhMmU4NWI5YmFjMmQ1NmIxYTJlODViOWI=}

# Spring AI / OpenAI Settings
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}