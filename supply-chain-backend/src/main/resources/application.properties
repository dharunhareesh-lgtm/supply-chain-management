spring.application.name=supply-chain-backend

# =========================
# Server
# =========================
server.port=${PORT:8082}
server.shutdown=graceful

# =========================
# Database (Railway MySQL)
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Gmail
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Health
# =========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# =========================
# Logging
# =========================
logging.level.root=INFO
logging.level.com.scms=INFO
logging.level.org.springframework.web=INFO

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# OpenAI
# =========================
spring.ai.openai.api-key=${OPENAI_API_KEY}

# =========================
# OCR
# =========================
scms.kyc.debug-mode=${DEBUG_MODE:true}
scms.ocr.tessdata-path=${TESSDATA_PATH:/app/tessdata}

# =========================
# AWS S3
# =========================
scms.aws.s3.access-key=${AWS_ACCESS_KEY_ID}
scms.aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
scms.aws.s3.region=${AWS_REGION}
scms.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
scms.aws.s3.retention-days=${AWS_S3_RETENTION_DAYS:30}
scms.aws.s3.encryption-secret=${ENCRYPTION_SECRET}