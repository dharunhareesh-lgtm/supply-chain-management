spring.application.name=supply-chain-backend

# =========================
# Server
# =========================
server.port=${PORT:8082}
server.shutdown=graceful

# =========================
# Database (Railway MySQL / Local)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:supply_chain_db}?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Gmail
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Health
# =========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# =========================
# Logging
# =========================
logging.level.root=INFO
logging.level.com.scms=INFO
logging.level.org.springframework.web=INFO

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# OpenAI
# =========================
spring.ai.openai.api-key=${OPENAI_API_KEY}

# =========================
# OCR
# =========================
scms.kyc.debug-mode=${DEBUG_MODE:true}
scms.ocr.tessdata-path=${TESSDATA_PATH:/app/tessdata}

# =========================
# AWS S3
# =========================
scms.aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
scms.aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
scms.aws.s3.region=${AWS_REGION}
scms.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
scms.aws.s3.retention-days=${AWS_S3_RETENTION_DAYS:30}
scms.aws.s3.encryption-secret=${ENCRYPTION_SECRET}

# =========================
# Government Market Price API (data.gov.in)
# =========================
scms.gov.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
scms.gov.api.key=${DATA_GOV_API_KEY}
scms.gov.api.max-pages=${SCMS_GOV_API_MAX_PAGES:100}
scms.gov.api.page-size=${SCMS_GOV_API_PAGE_SIZE:10}
scms.gov.api.page-delay-ms=${SCMS_GOV_API_PAGE_DELAY_MS:1500}
# =========================
# AGMARKNET API (Historical Backfill)
# =========================
scms.agmarknet.api.url=${SCMS_AGMARKNET_API_URL:https://api.agmarknet.gov.in/v1/prices-and-arrivals/date-wise/specific-commodity}
scms.agmarknet.api.filter-url=${SCMS_AGMARKNET_FILTER_URL:https://api.agmarknet.gov.in/v1/daily-price-arrival/filters}
scms.agmarknet.api.delay-ms=${SCMS_AGMARKNET_DELAY_MS:2000}
scms.seeder.delay-ms=${SCMS_SEEDER_DELAY_MS:2000}

# =========================
# Production Switch
# =========================
scms.scheduler.enabled=${SCHEDULER_ENABLED:true}

# =========================
# Demand Forecast Demo Mode (Isolated testing dataset)
# Set to 'false' to enforce authentic orders only in production
# =========================
demand.forecast.demo-mode=${DEMAND_FORECAST_DEMO_MODE:true}